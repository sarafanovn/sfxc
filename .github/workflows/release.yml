# Push a tag like v0.2.0 to publish a release. The tag must match `version` in Cargo.toml.
# Asset names are what install.sh downloads: sfxc-app-<arch>.zip and sfxc-cli-<arch>.
# With a TAP_TOKEN secret, the last job bumps sarafanovn/homebrew-tap to the new version.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml says $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build sfxc.app
        run: ./scripts/bundle.sh ${{ matrix.target }}

      - name: Build sfxc-cli
        run: cargo build --release --locked -p sfxc-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent target/sfxc.app dist/sfxc-app-${{ matrix.arch }}.zip
          cp target/${{ matrix.target }}/release/sfxc-cli dist/sfxc-cli-${{ matrix.arch }}
          codesign --force --sign - dist/sfxc-cli-${{ matrix.arch }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && shasum -a 256 * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  tap:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Bump the Homebrew cask and formula
        env:
          # Fine-grained token with Contents: read and write on sarafanovn/homebrew-tap only.
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::TAP_TOKEN is not set; the Homebrew tap was not updated"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY"
          sums="$(curl -fsSL "$base/releases/download/$GITHUB_REF_NAME/SHA256SUMS")"
          arm="$(awk '$2 == "sfxc-app-arm64.zip" { print $1 }' <<<"$sums")"
          intel="$(awk '$2 == "sfxc-app-x86_64.zip" { print $1 }' <<<"$sums")"
          src="$(curl -fsSL "$base/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)"
          [ -n "$arm" ] && [ -n "$intel" ] && [ -n "$src" ] || { echo "::error::missing checksums"; exit 1; }

          git clone -q "https://x-access-token:$TAP_TOKEN@github.com/sarafanovn/homebrew-tap.git" tap
          cd tap
          sed -i -E \
            -e "s/^(\s*version )\"[^\"]*\"/\1\"$version\"/" \
            -e "s/(sha256 arm: *)\"[0-9a-f]{64}\"/\1\"$arm\"/" \
            -e "s/(intel: *)\"[0-9a-f]{64}\"/\1\"$intel\"/" \
            Casks/sfxc.rb
          sed -i -E \
            -e "s#(/archive/refs/tags/)v[^\"]*\.tar\.gz#\1$GITHUB_REF_NAME.tar.gz#" \
            -e "s/^(\s*sha256 )\"[0-9a-f]{64}\"/\1\"$src\"/" \
            Formula/sfxc-cli.rb
          grep -q "\"$version\"" Casks/sfxc.rb && grep -q "$src" Formula/sfxc-cli.rb || { echo "::error::the cask or formula did not take the new version"; git diff; exit 1; }
          git diff --stat
          git diff --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "sfxc $version"
          git push -q
